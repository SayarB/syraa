# Internal-only SearXNG used by the Syraa API (web_search tool). Not exposed publicly.
# server.secret_key comes from the SEARXNG_SECRET environment variable.
use_default_settings: true

general:
  instance_name: "syraa-search"

server:
  # The API is the only client (port bound to 127.0.0.1), so the bot limiter is not needed.
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  # json is what the API reads; html kept for manual debugging via the local port.
  formats:
    - html
    - json

engines:
  # Image search: Google instead of Bing. Bing's image index returned unrelated results for place
  # names (Halo book covers for "Chail Himachal Pradesh"). Two Google engines are listed because
  # "google images" scrapes google.com and is often blocked (403) from server IPs, while
  # "google cse images" keeps working. Other default image engines stay on as fallbacks.
  - name: bing images
    disabled: true
  - name: google images
    disabled: false
    weight: 2
  - name: google cse images
    disabled: false
    weight: 2

outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0
