name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://everyday:everyday@localhost:5432/everyday
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: everyday
          POSTGRES_PASSWORD: everyday
          POSTGRES_DB: everyday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U everyday -d everyday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript lint and typecheck
        run: npm run check:ts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Python lint and format check
        run: npm run check:py

      - name: Build packages
        run: npm run build -w @everyday/memory && npm run build -w @everyday/harness && npm run build -w @everyday/api

      - name: Migrate database
        run: npm run db:migrate:dist -w @everyday/memory

      - name: TypeScript tests
        run: npm run test:ts

      - name: Python tests
        run: npm run test:py
