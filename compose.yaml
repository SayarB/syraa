services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syraa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syraa}
      POSTGRES_DB: ${POSTGRES_DB:-syraa}
    # Bind localhost only — safe on a VPS; host tools still reach via 127.0.0.1
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syraa} -d ${POSTGRES_DB:-syraa}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  searxng:
    # Web search backend for the web_search tool (internal only; see docker/searxng/settings.yml)
    build:
      context: docker/searxng
    restart: unless-stopped
    environment:
      # Required — SearXNG will not start without a real secret (e.g. openssl rand -hex 32)
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET (e.g. openssl rand -hex 32)}
    # Bind localhost only — never publicly reachable; the api container uses http://searxng:8080
    ports:
      - "${SEARXNG_HOST_BIND:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  crawl4ai:
    # Page reader for the web_fetch tool. Own network: it can't reach postgres/redis/searxng/api.
    image: unclecode/crawl4ai:0.9.3
    restart: unless-stopped
    shm_size: 1g
    mem_limit: 2g
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN (e.g. openssl rand -hex 32)}
    networks:
      - crawl
    # Bind localhost only — never publicly reachable; the api container uses http://crawl4ai:11235
    ports:
      - "${CRAWL4AI_HOST_BIND:-127.0.0.1}:${CRAWL4AI_PORT:-11235}:11235"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11235/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    networks:
      - default
      - crawl
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-syraa}:${POSTGRES_PASSWORD:-syraa}@postgres:5432/${POSTGRES_DB:-syraa}
      REDIS_URL: redis://redis:6379
      DRIVE_ROOT: /data/drive
      STATIC_DIR: /app/apps/web/dist
      NODE_ENV: production
      PORT: "3000"
      # Public origin (https://your.domain) — required for cookies behind Dokploy/Traefik
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-fireworks}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # web_search tool — set empty to disable web search
      SEARXNG_URL: ${SEARXNG_URL-http://searxng:8080}
      # web_fetch tool — set CRAWL4AI_URL empty to disable page reading
      CRAWL4AI_URL: ${CRAWL4AI_URL-http://crawl4ai:11235}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN}
      # Query embedding for search_materials — must match the ingest-worker's embedding model
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Prefer IPv4 — Fireworks AAAA often ETIMEDOUT from Docker/OrbStack
      NODE_OPTIONS: --dns-result-order=ipv4first
      FORCE_IPV4: "1"
    volumes:
      - drive_data:/data/drive
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  ingest-worker:
    build:
      context: .
      dockerfile: services/ingest-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-syraa}:${POSTGRES_PASSWORD:-syraa}@postgres:5432/${POSTGRES_DB:-syraa}
      DRIVE_ROOT: /data/drive
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - drive_data:/data/drive

networks:
  # Only crawl4ai and api share this network.
  crawl: {}

volumes:
  postgres_data:
  drive_data:
