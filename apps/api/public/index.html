<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Everyday</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <h1>Everyday</h1>
          <p id="subtitle" class="subtitle">Chat + Memory (local Postgres)</p>
        </div>
        <label class="user-field">
          User
          <input id="user-id" type="text" value="demo-user" spellcheck="false" />
        </label>
      </header>

      <main class="main">
        <section class="panel chat-panel">
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="chat-form" class="composer">
            <input
              id="message-input"
              type="text"
              placeholder="Talk normally — memory builds as you go…"
              autocomplete="off"
              required
            />
            <button id="send-btn" type="submit">Send</button>
          </form>
        </section>

        <aside class="panel memory-panel">
          <div class="memory-header">
            <h2>Memory</h2>
            <button id="refresh-memory" type="button" class="ghost">Refresh</button>
          </div>
          <div id="memory-meta" class="memory-meta"></div>
          <div id="memory-items" class="memory-items"></div>
        </aside>
      </main>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
