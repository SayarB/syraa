<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYRAA</title>
    <script>
      // Apply the cached theme before first paint (see src/lib/theme.ts, key "syraa:theme").
      (() => {
        const root = document.documentElement;
        let mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        let palette = "sage";
        try {
          const saved = JSON.parse(localStorage.getItem("syraa:theme") || "{}");
          if (saved.mode === "light" || saved.mode === "dark") mode = saved.mode;
          if (typeof saved.palette === "string") palette = saved.palette;
        } catch {
          // storage blocked — keep defaults
        }
        if (mode === "dark") root.classList.add("dark");
        if (palette !== "sage") root.dataset.palette = palette;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
