services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-everyday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-everyday}
      POSTGRES_DB: ${POSTGRES_DB:-everyday}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-everyday} -d ${POSTGRES_DB:-everyday}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-everyday}:${POSTGRES_PASSWORD:-everyday}@postgres:5432/${POSTGRES_DB:-everyday}
      REDIS_URL: redis://redis:6379
      DRIVE_ROOT: /data/drive
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      CHAT_PROVIDER: ${CHAT_PROVIDER:-fireworks}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - drive_data:/data/drive

  ingest-worker:
    build:
      context: .
      dockerfile: services/ingest-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-everyday}:${POSTGRES_PASSWORD:-everyday}@postgres:5432/${POSTGRES_DB:-everyday}
      DRIVE_ROOT: /data/drive
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - drive_data:/data/drive

volumes:
  postgres_data:
  drive_data:
